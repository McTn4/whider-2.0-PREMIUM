# Compila WHIDER para Android en GitHub.
#  - APK de pruebas (app-debug.apk): artefacto «whider-apk» de cada ejecución. Se instala directamente. Lo que
#    descarga la gente es el de cada versión publicada (WHIDER-android.apk, ver release.yml).
#  - Paquete para Google Play (whider-play.aab): artefacto «whider-google-play» de cada ejecución.
#    Se firma con tu clave de subida si están estos secretos del repositorio (Settings → Secrets and
#    variables → Actions): ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_UPLOAD_STORE_PASSWORD,
#    ANDROID_UPLOAD_KEY_ALIAS y ANDROID_UPLOAD_KEY_PASSWORD (ver docs/PUBLICAR-EN-GOOGLE-PLAY.md).
#    Sin ellos se genera igualmente, sin firmar, para comprobar que la versión de Play compila.
# Se recompila al cambiar la app (web o Android), a mano desde Actions → "Compilar APK" → "Run workflow"
# y al publicar una versión (release.yml).
name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'fonts/**'
      - 'icons/**'
      - 'package_apk.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version_release:
        description: 'Compilación para publicar una versión'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copiar la app web al proyecto Android
        run: python package_apk.py --sync

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Mostrar la huella SHA-1 del APK (para registrarla en Firebase)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-1|SHA-256"

      - name: Preparar la clave de subida a Google Play
        if: ${{ env.HAS_UPLOAD_KEY == 'true' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/whider-upload.jks"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}

      - name: Compilar el paquete para Google Play (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace
        env:
          WHIDER_UPLOAD_KEYSTORE: ${{ env.HAS_UPLOAD_KEY == 'true' && format('{0}/whider-upload.jks', runner.temp) || '' }}
          WHIDER_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          WHIDER_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          WHIDER_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Comprobar la firma del paquete para Google Play
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          cp "$AAB" whider-play.aab
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            keytool -printcert -jarfile whider-play.aab | grep -E "SHA1|SHA256|Propietario|Owner" || true
            echo "### Paquete para Google Play listo y firmado con tu clave de subida" >> "$GITHUB_STEP_SUMMARY"
            echo "Descárgalo en el artefacto **whider-google-play** y súbelo en Play Console." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Paquete para Google Play generado SIN FIRMAR" >> "$GITHUB_STEP_SUMMARY"
            echo "Compila bien, pero para subirlo a Play Console añade los secretos de la clave de subida (docs/PUBLICAR-EN-GOOGLE-PLAY.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RUNNER_TEMP/whider-upload.jks"

      - name: Guardar el paquete para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: whider-google-play
          path: whider-play.aab

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: whider-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: ${{ inputs.version_release && 7 || 30 }}
