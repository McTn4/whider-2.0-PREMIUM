# Compila el APK de WHIDER automáticamente en GitHub cada vez que se suben cambios.
# Descarga: pestaña "Releases" del repositorio → "WHIDER (última versión)" → app-debug.apk
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copiar la app web al proyecto Android
        run: python package_apk.py --sync

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Mostrar la huella SHA-1 del APK (para registrarla en Firebase)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-1|SHA-256"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: whider-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en "Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WHIDER (última versión)
          prerelease: false
          make_latest: true
          body: |
            APK generado automáticamente desde el commit ${{ github.sha }}.
            Descarga **app-debug.apk** e instálalo en tu móvil Android
            (permite "Instalar apps de orígenes desconocidos" si te lo pide).
          files: android/app/build/outputs/apk/debug/app-debug.apk
