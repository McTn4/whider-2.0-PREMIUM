# Compila WHIDER para ordenador (Windows, macOS y Linux).
#  - En cada cambio de la app: comprueba que compila y deja los instaladores como artefacto «whider-…» de la
#    ejecución (para probarlos). No se publican: lo que descarga la gente son las versiones publicadas.
#  - Al publicar una versión (release.yml la llama con version_release): los mismos instaladores, con los
#    archivos que usan las actualizaciones automáticas (latest*.yml y *.blockmap).
# Salida: WHIDER-Setup.exe (Windows) · WHIDER-mac-arm64.dmg y WHIDER-mac-x64.dmg (macOS) ·
#         WHIDER-linux.AppImage y WHIDER-linux.deb (Linux)
name: Compilar app de escritorio

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'manifest.json'
      - 'css/**'
      - 'js/**'
      - 'fonts/**'
      - 'icons/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version_release:
        description: 'Compilación para publicar una versión'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            target: --win
          - os: macos-latest
            name: macOS
            target: --mac
          - os: ubuntu-latest
            name: Linux
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci

      - name: Copiar la app web
        working-directory: desktop
        run: npm run sync

      # A veces GitHub responde 504 al descargar Electron o su lista de sumas de comprobación
      # (SHASUMS256.txt): se reintenta hasta 4 veces, con pausas, antes de dar la compilación por fallida.
      # --publish never: la publicación la hace release.yml, con las notas del CHANGELOG.
      - name: Compilar
        working-directory: desktop
        shell: bash
        run: |
          for i in 1 2 3 4; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "::warning::Intento $i fallido; se reintenta en $((i * 30)) s"
            sleep $((i * 30))
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Tamaño de cada instalador
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          cd desktop/dist
          for f in *.exe *.dmg *.AppImage *.deb; do
            [ -f "$f" ] && echo "- $f: $(( $(wc -c < "$f") / 1048576 )) MB" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: whider-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: ${{ inputs.version_release && 7 || 30 }}
