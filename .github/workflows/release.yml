# Publica una versión de WHIDER en GitHub («Releases») cuando cambia la versión de package.json.
#
#  1. Comprueba que todo lleva la misma versión (node tools/version.js --check) y que CHANGELOG.md la tiene.
#     Si la etiqueta vX.Y.Z ya existe, no hace nada.
#  2. Compila la app de escritorio (Windows, macOS y Linux) y Android con los mismos flujos de cada cambio.
#  3. Crea la publicación vX.Y.Z con las notas del CHANGELOG y todos los instaladores. Las de prueba
#     (X.Y.Z-beta.N) salen como «Pre-release»; las estables pasan a ser «Latest», que es la que usan las
#     actualizaciones automáticas del ordenador y los enlaces …/releases/latest/download/… de la portada.
#
# Cómo publicar una versión: docs/PUBLICAR-UNA-VERSION.md
name: Publicar versión

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-version
  cancel-in-progress: false

jobs:
  comprobar:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      nueva: ${{ steps.v.outputs.nueva }}
      beta: ${{ steps.v.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versión y CHANGELOG al día
        run: node tools/version.js --check
      - name: ¿Ya está publicada?
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "beta=true" >> "$GITHUB_OUTPUT" ;; *) echo "beta=false" >> "$GITHUB_OUTPUT" ;; esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "nueva=false" >> "$GITHUB_OUTPUT"
            echo "La versión **$V** ya está publicada: no hay nada que hacer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "nueva=true" >> "$GITHUB_OUTPUT"
            echo "Se publica la versión **$V**." >> "$GITHUB_STEP_SUMMARY"
          fi

  escritorio:
    name: Escritorio
    needs: comprobar
    if: needs.comprobar.outputs.nueva == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      version_release: true

  android:
    name: Android
    needs: comprobar
    if: needs.comprobar.outputs.nueva == 'true'
    uses: ./.github/workflows/android.yml
    with:
      version_release: true
    secrets: inherit

  publicar:
    name: Publicar
    needs: [comprobar, escritorio, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: whider-*
          merge-multiple: true

      - name: Reunir los archivos de la publicación
        env:
          V: ${{ needs.comprobar.outputs.version }}
        run: |
          mkdir -p rel
          for f in WHIDER-Setup.exe WHIDER-mac-arm64.dmg WHIDER-mac-x64.dmg WHIDER-linux.AppImage WHIDER-linux.deb latest.yml latest-linux.yml; do
            test -f "out/$f" || { echo "::error::Falta $f"; exit 1; }
          done
          cp out/*.exe out/*.dmg out/*.AppImage out/*.deb out/latest*.yml rel/
          cp out/*.blockmap rel/ 2>/dev/null || true
          cp out/app-debug.apk rel/WHIDER-android.apk
          # Las actualizaciones automáticas solo aceptan el archivo de la versión que anuncian
          grep -q "^version: $V$" out/latest.yml || { echo "::error::latest.yml no es de la $V"; cat out/latest.yml; exit 1; }
          node tools/version.js --notes "$V" > notas.md
          (cd rel && sha256sum * > SHA256SUMS.txt)
          ls -la rel
          { echo "### Archivos"; echo; echo '```'; cat rel/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar en «Releases»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.comprobar.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WHIDER ${{ needs.comprobar.outputs.version }}
          body_path: notas.md
          prerelease: ${{ needs.comprobar.outputs.beta == 'true' }}
          make_latest: ${{ needs.comprobar.outputs.beta == 'true' && 'false' || 'true' }}
          files: rel/*
          fail_on_unmatched_files: true
