<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Entrar en WHIDER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
  <!--
    WHIDER · Entrar con Microsoft o Apple desde la app de Android.
    Ninguno de los dos deja iniciar sesión dentro de la app (y Microsoft no deja pasar su credencial a otra app), así que
    la app abre esta página en el navegador del móvil: /entrar/?p=PROVEEDOR&s=CÓDIGO&to=android[&lang=en].
    Al entrar, la página vuelve a la app con la sesión de Firebase (whider://auth?s=CÓDIGO&u=SESIÓN, ver
    js/core/auth.js → onBrowserLink) y cierra la suya. La app solo la acepta si trae el código que ella misma generó.
  -->
  <style>
    @font-face { font-family: 'Inter'; src: url('../fonts/inter-latin-opsz-normal.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root { --bg: #000000; --s1: #16181C; --t1: #E7E9EA; --t2: #A1A5AB; --t3: #9298A0; --line: #2F3336; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--t1); font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 28px 18px calc(28px + env(safe-area-inset-bottom)); }
    main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
    .card { width: 100%; padding: 32px 22px 24px; border-radius: 20px; background: var(--s1); box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .w { width: 56px; height: 56px; margin-bottom: 4px; filter: drop-shadow(0 0 12px rgba(255,255,255,.3)); }
    h1 { margin: 4px 0 0; font-size: 1.6rem; font-weight: 800; line-height: 1.2; letter-spacing: -.02em; }
    p { margin: 0; color: var(--t2); line-height: 1.5; }
    .btns { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 20px; border-radius: 999px; font: inherit; font-size: 16px; text-decoration: none; cursor: pointer; }
    .btn.provider { border: 1px solid #8E918F; background: #131314; color: #E3E3E3; font-weight: 500; }
    .btn.primary { border: 0; background: #FFFFFF; color: #000000; font-weight: 700; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .btn:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }
    .note { font-size: 13px; color: var(--t3); }
    .note a { color: var(--t1); }
  </style>
</head>
<body>
<main>
  <div class="card">
    <svg class="w" viewBox="4 8 56 46" aria-hidden="true"><path d="M12.5 22.5 23 45l9-15.5L41 45l11-28" fill="none" stroke="#fff" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="title">Entrar en WHIDER</h1>
    <p id="msg" role="status">Un momento…</p>
    <div class="btns">
      <button class="btn provider" id="go" type="button" hidden></button>
      <a class="btn primary" id="back" href="#" hidden>Volver a WHIDER</a>
      <a class="btn provider" id="web" href="../app" hidden>Abrir WHIDER</a>
    </div>
  </div>
  <p class="note" id="note" hidden></p>
</main>
<script src="../js/config.js"></script>
<script src="../js/vendor/firebase.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var ID = q.get('p') || '', S = q.get('s') || '', TO = q.get('to') || '', EN = q.get('lang') === 'en';
  var LOGOS = {
    'google.com': '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>',
    'microsoft.com': '<svg viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>',
    'apple.com': '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.37 12.73c-.03-2.86 2.34-4.24 2.45-4.31-1.33-1.95-3.41-2.22-4.15-2.25-1.77-.18-3.45 1.04-4.35 1.04-.9 0-2.28-1.01-3.75-.99-1.93.03-3.71 1.12-4.7 2.85-2 3.48-.51 8.62 1.44 11.44.95 1.38 2.09 2.93 3.58 2.87 1.44-.06 1.98-.93 3.72-.93 1.74 0 2.23.93 3.75.9 1.55-.03 2.53-1.4 3.47-2.79 1.1-1.6 1.55-3.15 1.57-3.23-.03-.02-3.01-1.16-3.04-4.6zM13.51 4.32c.79-.96 1.33-2.29 1.18-3.62-1.14.05-2.53.76-3.35 1.72-.73.85-1.38 2.2-1.2 3.51 1.27.1 2.57-.65 3.37-1.61z"/></svg>'
  };
  var NAMES = { 'google.com': 'Google', 'microsoft.com': 'Microsoft', 'apple.com': 'Apple' };
  var REDIRECT = 'whider.entrar.redirect';
  var T = EN ? {
    title: 'Sign in to WHIDER',
    intro: 'Press the button to continue with your {name} account. Then go back to the app.',
    button: 'Continue with {name}',
    choose: 'Choose your account in the {name} window…',
    done: 'Done. Go back to WHIDER to finish signing in.',
    back: 'Back to WHIDER',
    closed: 'You closed the {name} window. Press the button to try again.',
    exists: 'You already have a WHIDER account with that email. Sign in with the method you used the first time (for example, Google).',
    disabled: "{name} isn't enabled in Firebase (Authentication → Sign-in method).",
    domain: "This domain isn't authorized in Firebase (Authentication → Settings).",
    failed: "Couldn't sign in with {name}",
    retry: '. Try again.',
    direct: 'This page opens from the WHIDER app to sign in with your account. To use WHIDER in your browser:',
    web: 'Open WHIDER',
    noconfig: "This copy of WHIDER doesn't have accounts set up."
  } : {
    title: 'Entrar en WHIDER',
    intro: 'Pulsa el botón para continuar con tu cuenta de {name}. Después vuelve a la app.',
    button: 'Continuar con {name}',
    choose: 'Elige tu cuenta en la ventana de {name}…',
    done: 'Listo. Vuelve a WHIDER para terminar de entrar.',
    back: 'Volver a WHIDER',
    closed: 'Has cerrado la ventana de {name}. Pulsa el botón para intentarlo otra vez.',
    exists: 'Ya tienes una cuenta de WHIDER con ese correo. Entra con el método que usaste la primera vez (por ejemplo, Google).',
    disabled: '{name} no está activado en Firebase (Authentication → Método de acceso).',
    domain: 'Este dominio no está autorizado en Firebase (Authentication → Configuración).',
    failed: 'No se pudo entrar con {name}',
    retry: '. Inténtalo otra vez.',
    direct: 'Esta página se abre desde la app de WHIDER para entrar con tu cuenta. Para usar WHIDER en el navegador:',
    web: 'Abrir WHIDER',
    noconfig: 'Esta copia de WHIDER no tiene cuentas configuradas.'
  };
  var name = NAMES[ID] || '';
  var t = function (k) { return T[k].replace('{name}', name); };
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg'), go = $('go'), back = $('back'), web = $('web');
  if (EN) document.documentElement.lang = 'en';
  document.title = $('title').textContent = t('title');
  back.textContent = t('back');
  web.textContent = t('web');

  // Solo desde la app (con su código): si no, a la app web
  if (!NAMES[ID] || !/^[0-9a-f]{16,64}$/.test(S) || TO !== 'android') {
    msg.textContent = t('direct');
    web.hidden = false;
    return;
  }
  var F = window.WFB, cfg = window.WHIDER_CONFIG || {};
  if (!F || !cfg.firebase) { msg.textContent = t('noconfig'); return; }
  var app = F.initializeApp(cfg.firebase, 'whider-entrar');
  var auth = F.initializeAuth(app, { persistence: F.browserLocalPersistence, popupRedirectResolver: F.browserPopupRedirectResolver });
  if (cfg.emulator) F.connectAuthEmulator(auth, cfg.emulator.auth, { disableWarnings: true });
  auth.languageCode = EN ? 'en' : 'es';

  function provider() {
    var p = ID === 'google.com' ? new F.GoogleAuthProvider() : new F.OAuthProvider(ID);
    if (ID === 'apple.com') { p.addScope('email'); p.addScope('name'); p.setCustomParameters({ locale: EN ? 'en_US' : 'es_ES' }); }
    else p.setCustomParameters({ prompt: 'select_account' });
    return p;
  }
  /** Lo imprescindible de la sesión (lo mismo que acepta la app), en base64url */
  function pack(user) {
    var j = user.toJSON(), tm = j.stsTokenManager || {};
    var o = {
      uid: j.uid, email: j.email, emailVerified: !!j.emailVerified, isAnonymous: false, displayName: j.displayName, photoURL: j.photoURL,
      providerData: (j.providerData || []).map(function (x) { return { providerId: x.providerId, uid: x.uid, displayName: x.displayName, email: x.email, photoURL: x.photoURL }; }),
      stsTokenManager: { refreshToken: tm.refreshToken, accessToken: tm.accessToken, expirationTime: tm.expirationTime },
      createdAt: j.createdAt, lastLoginAt: j.lastLoginAt
    };
    var bytes = new TextEncoder().encode(JSON.stringify(o)), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  /** Vuelta a la app (solo la de WHIDER: el paquete va en el enlace) con la sesión; aquí se cierra */
  function finish(user) {
    var url = 'intent://auth?s=' + S + '&u=' + pack(user) + '#Intent;scheme=whider;package=com.whider.app;end';
    F.signOut(auth).catch(function () {});
    history.replaceState(null, '', location.pathname);
    go.hidden = true;
    back.href = url;
    back.hidden = false;
    msg.textContent = t('done');
    try { location.href = url; } catch (e) { /* queda el botón */ }
  }
  function fail(e) {
    go.disabled = false;
    var code = (e && e.code) || '';
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') msg.textContent = t('closed');
    else if (code === 'auth/account-exists-with-different-credential') msg.textContent = t('exists');
    else if (code === 'auth/operation-not-allowed') msg.textContent = t('disabled');
    else if (code === 'auth/unauthorized-domain') msg.textContent = t('domain');
    else msg.textContent = t('failed') + (code ? ' (' + code + ')' : '') + t('retry');
  }

  go.innerHTML = LOGOS[ID] + '<span></span>';
  go.lastChild.textContent = t('button');
  go.hidden = false;
  msg.textContent = t('intro');
  go.addEventListener('click', function () {
    go.disabled = true;
    msg.textContent = t('choose');
    F.signInWithPopup(auth, provider()).then(function (r) { finish(r.user); }).catch(function (e) {
      // Si el navegador no abre la ventana, se entra en esta misma pestaña y se vuelve aquí
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
        try { sessionStorage.setItem(REDIRECT, '1'); } catch (x) { /* sin almacenamiento */ }
        return F.signInWithRedirect(auth, provider());
      }
      fail(e);
    });
  });
  // Vuelta de la redirección (solo si se empezó una: así no se carga nada más al abrir la página)
  var redirected = false;
  try { redirected = sessionStorage.getItem(REDIRECT) === '1'; sessionStorage.removeItem(REDIRECT); } catch (x) { /* sin almacenamiento */ }
  if (redirected) {
    go.disabled = true;
    msg.textContent = t('choose');
    F.getRedirectResult(auth).then(function (r) { if (r && r.user) finish(r.user); else { go.disabled = false; msg.textContent = t('intro'); } }).catch(fail);
  }
})();
</script>
</body>
</html>
