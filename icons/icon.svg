<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c202a" />
      <stop offset="100%" stop-color="#090a0d" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Dark con esquinas redondeadas tipo Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#282e3b" stroke-width="4" />

  <!-- Logo estilizado W -->
  <g filter="url(#glow)">
    <polyline points="120,180 185,350 256,230 327,350 392,180" 
              fill="none" 
              stroke="#f3f4f6" 
              stroke-width="36" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
  </g>

  <!-- Estrella dorada de remarcado -->
  <polygon points="380,110 388,126 405,128 392,141 395,158 380,150 365,158 368,141 355,128 372,126" 
           fill="#f59e0b" />
</svg>
