plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whider.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.whider.app"
        minSdk 24
        targetSdk 34
        versionCode 601
        versionName "6.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Firma fija para las versiones de prueba: así la huella SHA-1 es siempre la misma
    // (en cualquier ordenador y en la compilación automática de GitHub) y Google la reconoce.
    // SHA-1: 4F:33:7F:B5:D2:11:79:C2:20:DF:EC:0F:94:AB:C5:D2:57:60:3C:FB
    signingConfigs {
        debug {
            storeFile file('whider-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    // Selector de fotos del sistema (foto de perfil)
    implementation 'androidx.activity:activity:1.9.3'
    // Inicio de sesión con Google (selector nativo de cuentas)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
