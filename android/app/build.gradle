plugins {
    id 'com.android.application'
}

// Clave de subida a Google Play (solo en la compilación de GitHub, desde sus secretos; nunca en el repositorio)
def uploadKeystore = System.getenv('WHIDER_UPLOAD_KEYSTORE')
def hasUploadKey = uploadKeystore != null && !uploadKeystore.isEmpty() && file(uploadKeystore).exists()

android {
    namespace 'com.whider.app'
    // Google Play exige Android 16 (API 36) para apps nuevas y actualizaciones desde el 31 de agosto de 2026
    compileSdk 36

    defaultConfig {
        applicationId "com.whider.app"
        minSdk 24
        targetSdk 36
        // Los pone tools/version.js desde package.json (versión única). versionCode = MAYOR·1.000.000 +
        // MENOR·10.000 + PARCHE·100 + (beta 31-59 · rc 61-89 · estable 99): siempre sube, como exige Google Play.
        versionCode 2020099
        versionName "2.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Firma fija para las versiones de prueba: así la huella SHA-1 es siempre la misma
    // (en cualquier ordenador y en la compilación automática de GitHub) y Google la reconoce.
    // SHA-1: 4F:33:7F:B5:D2:11:79:C2:20:DF:EC:0F:94:AB:C5:D2:57:60:3C:FB
    signingConfigs {
        debug {
            storeFile file('whider-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('WHIDER_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('WHIDER_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('WHIDER_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Paquete para Google Play (AAB). Sin la clave de subida se genera sin firmar.
            if (hasUploadKey) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    // Selector de fotos del sistema (foto de perfil)
    implementation 'androidx.activity:activity:1.9.3'
    // Inicio de sesión con Google (selector nativo de cuentas)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
