    /* Color de acento y tamaño de texto antes de pintar (sin parpadeos en la pantalla de carga) */
    (function () {
      try {
        var ui = JSON.parse(localStorage.getItem('whider.ui') || 'null'), st = document.documentElement.style;
        if (!ui) return;
        if (ui.a) { st.setProperty('--accent', ui.a); st.setProperty('--accent-2', ui.a2); st.setProperty('--accent-rgb', ui.rgb); st.setProperty('--on-accent', ui.on); }

    })();
  </script>
