<!-- Fondo animado -->
<div class="bg-fx" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="grain"></i></div>

<div class="app" id="app">
  <header class="topbar">
    <button class="avatar-btn fx-press" id="btnProfile" aria-label="Tu perfil y progreso"><span class="avatar" id="topAvatar">W</span></button>
    <div class="brand" aria-label="WHIDER">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo"/></svg>
      <span class="brand-word">WHIDER</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn fx-press" id="btnAlerts" aria-label="Avisos"><svg class="ic"><use href="#i-bell"/></svg><span class="badge-dot" data-badge="alerts"></span></button>
      <button class="icon-btn fx-press" id="btnSettings" aria-label="Ajustes"><svg class="ic"><use href="#i-sliders"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <section class="screen" id="screen-home" data-screen="home" aria-label="Inicio"></section>
    <section class="screen" id="screen-tasks" data-screen="tasks" aria-label="Tareas"></section>
    <section class="screen" id="screen-calendar" data-screen="calendar" aria-label="Calendario"></section>
    <section class="screen" id="screen-focus" data-screen="focus" aria-label="Enfoque"></section>
    <section class="screen" id="screen-progress" data-screen="progress" aria-label="Progreso"></section>
    <section class="screen" id="screen-alerts" data-screen="alerts" aria-label="Avisos"></section>
    <section class="screen" id="screen-settings" data-screen="settings" aria-label="Ajustes"></section>
  </main>

  <nav class="dock" aria-label="Navegación principal">
    <span class="dock-indicator" id="dockIndicator"></span>
    <button class="dock-tab" data-go="home"><svg class="ic"><use href="#i-home"/></svg><span>Inicio</span></button>
    <button class="dock-tab" data-go="tasks"><svg class="ic"><use href="#i-tasks"/></svg><span>Tareas</span></button>
    <button class="dock-fab fx-press" id="btnFab" aria-label="Nueva tarea"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button class="dock-tab" data-go="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span>Agenda</span></button>
    <button class="dock-tab" data-go="focus"><svg class="ic"><use href="#i-timer"/></svg><span>Enfoque</span></button>
  </nav>
</div>

<div class="sheet-root" id="sheetRoot"></div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
<div class="onboarding-root" id="onboardingRoot"></div>

<script src="js/core/util.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/ui/fx.js"></script>

<script src="js/ui/sheet.js"></script>
<script src="js/ui/controls.js"></script>
<script src="js/core/notify.js"></script>
<script src="js/ui/editor.js"></script>
<script src="js/ui/taskcard.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/tasks.js"></script>
<script src="js/screens/calendar.js"></script>
<script src="js/screens/focus.js"></script>
<script src="js/screens/progress.js"></script>
<script src="js/screens/alerts.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/onboarding.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
